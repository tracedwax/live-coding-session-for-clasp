<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Workspace Apps Script + Clasp Workshop</title>
  <meta name="description" content="Hands-on workshop for building Google Workspace automations with Apps Script, Clasp, and AI-assisted development tools.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <style>
    /* ── Light theme (default) ─────────────────────────── */
    :root {
      --theme-color: #4285f4;
      --text-color: #2c3e50;
      --bg-color: #ffffff;
      --sidebar-bg: #f8f9fa;
      --sidebar-border: #e8eaed;
      --sidebar-name-color: #1a73e8;
      --code-bg: #f6f8fa;
      --code-text: #36464e;
      --code-border: #e1e4e8;
      --blockquote-bg: #f1f3f4;
      --blockquote-border: #4285f4;
      --blockquote-text: #5f6368;
      --table-head-bg: #f1f3f4;
      --table-border: #dadce0;
      --table-stripe: #f8f9fa;
      --link-color: #1a73e8;
      --link-hover: #174ea6;
      --heading-color: #1a1a2e;
      --tip-bg: #e8f5e9;
      --tip-border: #34a853;
      --warning-bg: #fff3e0;
      --warning-border: #ea8600;
      --highlight-bg: #fff9c4;
    }

    /* ── Dark theme ────────────────────────────────────── */
    [data-theme="dark"] {
      --theme-color: #8ab4f8;
      --text-color: #c9d1d9;
      --bg-color: #0d1117;
      --sidebar-bg: #161b22;
      --sidebar-border: #30363d;
      --sidebar-name-color: #8ab4f8;
      --code-bg: #1c2128;
      --code-text: #e6edf3;
      --code-border: #30363d;
      --blockquote-bg: #161b22;
      --blockquote-border: #8ab4f8;
      --blockquote-text: #8b949e;
      --table-head-bg: #1c2128;
      --table-border: #30363d;
      --table-stripe: #161b22;
      --link-color: #58a6ff;
      --link-hover: #79c0ff;
      --heading-color: #e6edf3;
      --tip-bg: #0d2818;
      --tip-border: #2ea043;
      --warning-bg: #2a1f00;
      --warning-border: #d29922;
      --highlight-bg: #2a2000;
    }

    /* ── Base overrides ────────────────────────────────── */
    body { background: var(--bg-color) !important; color: var(--text-color) !important; }
    .sidebar { background: var(--sidebar-bg) !important; border-right: 1px solid var(--sidebar-border) !important; }
    .sidebar-nav li a { font-size: 14px; color: var(--text-color) !important; }
    .sidebar-nav li a:hover, .sidebar-nav li a.active { color: var(--theme-color) !important; }
    .app-name-link { color: var(--sidebar-name-color) !important; font-weight: 700; }
    .markdown-section { max-width: 900px; color: var(--text-color) !important; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5, .markdown-section h6 { color: var(--heading-color) !important; }
    .markdown-section h1 { border-bottom: 2px solid var(--theme-color); padding-bottom: 0.3em; }
    .markdown-section h2 { border-bottom: 1px solid var(--sidebar-border); padding-bottom: 0.25em; }
    .markdown-section a:not(h1 a):not(h2 a):not(h3 a):not(h4 a) { color: var(--link-color) !important; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .markdown-section a:not(h1 a):not(h2 a):not(h3 a):not(h4 a):hover { color: var(--link-hover) !important; border-bottom-color: var(--link-hover); }
    .markdown-section pre { background: var(--code-bg) !important; border: 1px solid var(--code-border) !important; border-radius: 8px !important; padding: 1em !important; }
    .markdown-section pre > code { color: var(--code-text) !important; background: transparent !important; border: none; padding: 0; }
    .markdown-section code { background: var(--code-bg) !important; color: var(--code-text) !important; border-radius: 4px; padding: 2px 6px; font-size: 0.88em; border: 1px solid var(--code-border); }
    .markdown-section table { display: table; width: 100%; border-collapse: collapse; }
    .markdown-section th { background: var(--table-head-bg) !important; color: var(--heading-color) !important; font-weight: 600; border: 1px solid var(--table-border) !important; padding: 10px 14px; }
    .markdown-section td { border: 1px solid var(--table-border) !important; padding: 8px 14px; color: var(--text-color) !important; }
    .markdown-section tr:nth-child(even) { background: var(--table-stripe) !important; }
    .markdown-section blockquote { background: var(--blockquote-bg) !important; border-left: 4px solid var(--blockquote-border) !important; color: var(--blockquote-text) !important; padding: 12px 20px; border-radius: 0 6px 6px 0; margin: 1em 0; }
    .markdown-section blockquote p { color: var(--blockquote-text) !important; }
    .markdown-section strong { color: var(--heading-color) !important; }
    .markdown-section p { color: var(--text-color) !important; }
    .markdown-section hr { border-color: var(--sidebar-border) !important; }

    /* Dark mode heading overrides */
    html[data-theme="dark"] .markdown-section h1, html[data-theme="dark"] .markdown-section h2 { color: #f0f6fc !important; }
    html[data-theme="dark"] .markdown-section h3 { color: #d2a8ff !important; }
    html[data-theme="dark"] section.content, html[data-theme="dark"] .content { background: #0d1117 !important; }

    /* Theme toggle */
    #theme-toggle { cursor: pointer; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 20px; padding: 4px 12px; font-size: 14px; color: var(--text-color); transition: all 0.3s ease; white-space: nowrap; margin-left: 4px; }
    #theme-toggle:hover { border-color: var(--theme-color); background: var(--blockquote-bg); }

    /* Copy button */
    .copy-btn { position: absolute; top: 6px; right: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: var(--code-bg); color: var(--blockquote-text); border: 1px solid var(--code-border); border-radius: 4px; opacity: 0; transition: opacity 0.2s; z-index: 1; }
    .copy-btn:hover { color: var(--theme-color); border-color: var(--theme-color); }
    .copy-btn.copied { color: #34a853; border-color: #34a853; }
    pre:hover .copy-btn { opacity: 1; }

    /* Search */
    .search input { background: var(--code-bg) !important; color: var(--text-color) !important; border-color: var(--code-border) !important; }
    .search { background: var(--sidebar-bg) !important; border-bottom: 1px solid var(--sidebar-border) !important; }

    /* Transitions */
    body, .sidebar, .markdown-section, .markdown-section pre, .markdown-section code,
    .markdown-section blockquote, .markdown-section table { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Apps Script + Clasp Workshop',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search workshop...',
        noData: 'No results.',
        depth: 3
      },
      auto2top: true,
      coverpage: false,
      notFoundPage: true,
      plugins: [
        // Theme toggle
        function(hook) {
          hook.doneEach(function() {
            if (document.getElementById('theme-toggle')) return;
            var nav = document.querySelector('.app-nav');
            if (!nav) {
              nav = document.createElement('nav');
              nav.className = 'app-nav';
              document.body.appendChild(nav);
            }
            var btn = document.createElement('button');
            btn.id = 'theme-toggle';
            btn.setAttribute('aria-label', 'Toggle dark mode');
            updateToggleText(btn);
            btn.addEventListener('click', function() {
              var current = document.documentElement.getAttribute('data-theme');
              var next = current === 'dark' ? 'light' : 'dark';
              document.documentElement.setAttribute('data-theme', next);
              localStorage.setItem('docsify-theme', next);
              updateToggleText(btn);
            });
            nav.appendChild(btn);
          });
        },
        // Copy button
        function(hook) {
          hook.doneEach(function() {
            document.querySelectorAll('pre:not(.copy-ready)').forEach(function(pre) {
              pre.classList.add('copy-ready');
              pre.style.position = 'relative';
              var btn = document.createElement('button');
              btn.className = 'copy-btn';
              btn.textContent = 'Copy';
              btn.addEventListener('click', function() {
                var code = pre.querySelector('code');
                if (!code) return;
                navigator.clipboard.writeText(code.textContent).then(function() {
                  btn.textContent = 'Copied!';
                  btn.classList.add('copied');
                  setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
                });
              });
              pre.appendChild(btn);
            });
          });
        }
      ]
    };

    function updateToggleText(btn) {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
    }

    (function() {
      var saved = localStorage.getItem('docsify-theme');
      if (saved) { document.documentElement.setAttribute('data-theme', saved); }
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
